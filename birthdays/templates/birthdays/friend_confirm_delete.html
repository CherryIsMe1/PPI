{% extends 'base.html' %}

{% block title %}Potwierdź usunięcie - UrodzinkiApp{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card border-0 shadow-sm text-center p-4">
      <div class="card-body">
        <div class="text-danger mb-3">
          <i class="bi bi-exclamation-triangle-fill" style="font-size: 3rem;"></i>
        </div>
        <h1 class="h4 fw-bold text-dark mb-2">Usunąć znajomego?</h1>
        <p class="text-muted mb-4">
          Czy na pewno chcesz bezpowrotnie usunąć z bazy znajomego <strong>{{ friend.first_name }} {{ friend.last_name }}</strong>?
        </p>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex justify-content-center gap-2">
            <a href="{% url 'birthdays:friend_list' %}" class="btn btn-light border px-4">Anuluj</a>
            <button type="submit" class="btn btn-danger px-4 fw-bold">
              <i class="bi bi-trash-fill me-1"></i> Tak, usuń
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
