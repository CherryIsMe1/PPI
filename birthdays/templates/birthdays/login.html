{% extends 'base.html' %}

{% block title %}Logowanie - UrodzinkiApp{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-7 col-lg-5 col-xl-4">
    <div class="card border-0 shadow-lg">
      <div class="card-header bg-transparent text-center py-4 border-0">
        <i class="bi bi-shield-lock-fill omi-brand-icon fs-1 d-block mb-2"></i>
        <h1 class="h3 fw-bold mb-1">Dostęp do systemu</h1>
        <p class="text-muted small mb-0">Zaloguj się, aby zarządzać kontaktami</p>
      </div>
      <div class="card-body p-4 pt-0">
        <form method="post" novalidate>
          {% csrf_token %}
          
          <div class="mb-3">
            <label for="id_username" class="form-label fw-semibold">Login</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
              <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username" class="form-control" placeholder="Wpisz swój login">
            </div>
          </div>

          <div class="mb-4">
            <label for="id_password" class="form-label fw-semibold">Hasło</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
              <input type="password" name="password" autocomplete="current-password" required id="id_password" class="form-control" placeholder="••••••••">
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3">
            <i class="bi bi-box-arrow-in-right me-1"></i> Zaloguj się
          </button>
        </form>

        <div class="text-center pt-3 border-top border-secondary border-opacity-25">
          <p class="small text-muted mb-0">
            Nie masz jeszcze konta? 
            <a href="{% url 'birthdays:register' %}" class="omi-cyan-text fw-bold text-decoration-none ms-1">
              Zarejestruj się tutaj
            </a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
